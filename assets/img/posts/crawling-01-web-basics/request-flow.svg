<text x="30" y="462" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" font-weight="400" fill="#616e7c" text-anchor="start">requests로 받은 HTML에는 4에서 그려지는 리뷰가 없다. 4의 JSON 주소를 알면 requests로 직접 받을 수 있다.</text>
