<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 320" width="830" height="320" role="img" aria-label="검사점과 장애 시점. 검사점 전에 커밋한 T1은 회복 작업 없음, 검사점 뒤 장애 전에 커밋한 T2는 REDO, 장애 때 실행 중이던 T3는 UNDO">
<title>검사점과 장애 시점. 검사점 전에 커밋한 T1은 회복 작업 없음, 검사점 뒤 장애 전에 커밋한 T2는 REDO, 장애 때 실행 중이던 T3는 UNDO</title>
<rect width="830" height="320" rx="12" fill="#ffffff"/>
<line x1="60" y1="250" x2="753.6" y2="250.0" stroke="#52606d" stroke-width="1.6"/>
<path d="M760.0,250.0 L752.0,254.0 L752.0,246.0 z" fill="#52606d"/>
<text x="760" y="274" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="400" fill="#616e7c" text-anchor="end">시간</text>
<line x1="360" y1="36" x2="360" y2="250" stroke="#2f5d8a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="360" y="272" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="700" fill="#2f5d8a" text-anchor="middle">검사점</text>
<line x1="640" y1="36" x2="640" y2="250" stroke="#c53030" stroke-width="2" stroke-dasharray="6 4"/>
<text x="640" y="272" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="700" fill="#c53030" text-anchor="middle">장애</text>
<text x="36" y="75" font-family="'D2Coding', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">T1</text>
<rect x="90" y="58" width="200" height="24" rx="4" fill="#e8f0f8" stroke="#2f5d8a" stroke-width="1.2"/>
<circle cx="290" cy="70" r="8" fill="#2f5d8a" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="290" y="74" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
<rect x="712" y="56" width="100" height="28" rx="6" fill="#ffffff" stroke="#616e7c" stroke-width="1.4"/>
<text x="762" y="75" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="700" fill="#616e7c" text-anchor="middle">회복 작업 없음</text>
<text x="36" y="133" font-family="'D2Coding', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">T2</text>
<rect x="250" y="116" width="290" height="24" rx="4" fill="#e8f0f8" stroke="#2f5d8a" stroke-width="1.2"/>
<circle cx="540" cy="128" r="8" fill="#2f5d8a" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="540" y="132" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
<rect x="712" y="114" width="100" height="28" rx="6" fill="#ffffff" stroke="#2f855a" stroke-width="1.4"/>
<text x="762" y="133" font-family="'D2Coding', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" font-weight="700" fill="#2f855a" text-anchor="middle">REDO</text>
<text x="36" y="191" font-family="'D2Coding', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">T3</text>
<rect x="470" y="174" width="170" height="24" rx="4" fill="#e8f0f8" stroke="#2f5d8a" stroke-width="1.2"/>
<text x="632" y="191" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#2f5d8a" text-anchor="end">…</text>
<rect x="712" y="172" width="100" height="28" rx="6" fill="#ffffff" stroke="#c53030" stroke-width="1.4"/>
<text x="762" y="191" font-family="'D2Coding', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" font-weight="700" fill="#c53030" text-anchor="middle">UNDO</text>
<text x="60" y="306" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="400" fill="#616e7c" text-anchor="start">C = 커밋. 회복은 마지막 검사점 이후만 본다: 커밋된 T2는 REDO, 끝나지 않은 T3는 UNDO, T1은 이미 반영됐다.</text>
</svg>
