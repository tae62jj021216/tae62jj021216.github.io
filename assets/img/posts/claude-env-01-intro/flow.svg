<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-label="세션 흐름: 세션 시작, 작업, 대화 80%, /handoff, /clear를 거쳐 새 세션으로 돌아가고, 각 시점에 인수인계 붙이기, 도구 실행 직전 검사, 파일 수정 뒤 동기화, 압축 직전 백업 hook이 끼어들며 위키 볼트에 쓰고 읽는다">
<title>세션 흐름: 세션 시작, 작업, 대화 80%, /handoff, /clear를 거쳐 새 세션으로 돌아가고, 각 시점에 인수인계 붙이기, 도구 실행 직전 검사, 파일 수정 뒤 동기화, 압축 직전 백업 hook이 끼어들며 위키 볼트에 쓰고 읽는다</title>
<rect width="860" height="430" rx="12" fill="#ffffff"/>
<text x="20" y="28" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">한 세션의 흐름과 hook이 끼어드는 시점</text>
