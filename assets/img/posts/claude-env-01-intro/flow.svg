<text x="100.0" y="256" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" font-weight="400" fill="#616e7c" text-anchor="middle">같은 폴더·48시간·1건</text>
<rect x="190" y="214" width="180" height="56" rx="8" fill="#fde8dd" stroke="#c05621" stroke-width="1.5"/>
<text x="280.0" y="236" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#c05621" text-anchor="middle">도구 실행 직전</text>
<text x="280.0" y="256" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" font-weight="400" fill="#616e7c" text-anchor="middle">원본 보호 · git 확인</text>
<rect x="190" y="280" width="180" height="56" rx="8" fill="#fde8dd" stroke="#c05621" stroke-width="1.5"/>
<text x="280.0" y="302" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#c05621" text-anchor="middle">파일 수정 뒤</text>
<text x="280.0" y="322" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" font-weight="400" fill="#616e7c" text-anchor="middle">설정 파일만 커밋·push</text>
<rect x="390" y="214" width="180" height="56" rx="8" fill="#fde8dd" stroke="#c05621" stroke-width="1.5"/>
<text x="480.0" y="236" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#c05621" text-anchor="middle">압축 직전</text>
<text x="480.0" y="256" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" font-weight="400" fill="#616e7c" text-anchor="middle">비우지 않고 계속 쓰면 백업</text>
<line x1="100" y1="114" x2="100" y2="214" stroke="#c05621" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="280" y1="114" x2="280" y2="214" stroke="#c05621" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="460" y1="114" x2="460" y2="214" stroke="#c05621" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="20" y="350" width="820" height="56" rx="8" fill="#eef1f4" stroke="#52606d" stroke-width="1.4"/>
<text x="36" y="374" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="start">위키 볼트</text>
<text x="36" y="393" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" font-weight="400" fill="#616e7c" text-anchor="start">커밋마다 비공개 저장소로 push</text>
<text x="250" y="383" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="start">결정 · 교훈 (save)</text>
<text x="470" y="383" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="start">자동백업/</text>
<text x="620" y="383" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="start">인수인계/ (handoff)</text>
<line x1="610" y1="114" x2="678.4075562943782" y2="344.6311897924749" stroke="#2f5d8a" stroke-width="1.4"/>
