<text x="610.0" y="97.0" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="middle">/handoff</text>
<line x1="680" y1="92" x2="674.4" y2="92.0" stroke="#52606d" stroke-width="1.5"/>
