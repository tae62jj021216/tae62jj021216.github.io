<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>상품 검색 - 가상카페 온라인몰</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header id="top">
<h1 class="logo">가상카페 온라인몰</h1>
<nav class="menu"><a href="../shop/list-1.html">전체 상품</a><a href="../shop/../dynamic/search.html">상품 검색</a><a href="../shop/../dynamic/stores.html">매장 찾기</a></nav>
</header>
<main>
<p class="notice">자바스크립트가 검색 결과를 그리는 연습 페이지입니다.</p>
<form id="search-form">
  <input type="text" id="keyword" name="q" placeholder="상품명">
  <button type="submit" id="search-btn">검색</button>
</form>
<div id="results"></div>
</main>
<footer>Taeyoon.log 크롤링 연습 페이지 · 모든 데이터는 가상입니다.</footer>
<script>
// 검색 버튼을 누르거나 Enter를 치면 0.8초 뒤에 결과를 그린다.
let products = [];
fetch('../shop/products.json').then(r => r.json()).then(d => { products = d; });
function search(ev) {
  ev.preventDefault();
  const q = document.getElementById('keyword').value.trim();
  const box = document.getElementById('results');
  box.innerHTML = '<p class="loading">검색 중...</p>';
  setTimeout(() => {
    const hits = products.filter(p => q && p.name.includes(q));
    box.innerHTML = hits.length
      ? '<p class="count">검색 결과 ' + hits.length + '건</p>' + hits.map(p =>
          '<div class="result"><h3><a href="../shop/item/' + p.id + '.html">' + p.name + '</a></h3>' +
          '<span class="price">' + (p.salePrice || p.price).toLocaleString() + '원</span></div>').join('')
      : '<p class="empty">검색 결과가 없습니다.</p>';
  }, 800);
}
document.getElementById('search-form').addEventListener('submit', search);
</script>
</body>
</html>
